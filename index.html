    let shuffledQuestions = [];
    let userAnswers = [];
    let totalQuestions = questionsData.length;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initQuiz() {
        shuffledQuestions = shuffleArray([...questionsData]);
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        userAnswers = new Array(shuffledQuestions.length).fill(null);

        shuffledQuestions.forEach((q, index) => {
            const block = document.createElement('div');
            block.className = 'question-block';
            block.id = `q-block-${index}`;
            
            let optionsHTML = '';
            let shuffledOptions = [];
            let correctIndex = q.correct;

            if (q.type === 'single' || q.type === 'boolean' || q.type === 'dropdown') {
                let indices = q.options.map((_, i) => i);
                shuffledOptions = shuffleArray([...indices]);
                correctIndex = shuffledOptions.indexOf(q.correct);
                q.shuffledCorrect = correctIndex;
                q.shuffledOptions = shuffledOptions.map(i => q.options[i]);
            } else if (q.type === 'multiple') {
                let indices = q.options.map((_, i) => i);
                shuffledOptions = shuffleArray([...indices]);
                q.shuffledOptions = shuffledOptions.map(i => q.options[i]);
                q.shuffledCorrect = q.correct.map(c => shuffledOptions.indexOf(c));
            }

            let questionHTML = `<div class="question-text">${index + 1}. ${q.question}</div>`;
            
            if (q.type === 'single' || q.type === 'boolean') {
                questionHTML += `<div class="options" id="options-${index}">`;
                q.shuffledOptions.forEach((opt, optIndex) => {
                    questionHTML += `<label class="option-item" id="opt-${index}-${optIndex}"><input type="radio" name="q${index}" value="${optIndex}" onchange="handleAnswer(${index}, this.value)"> ${opt}</label>`;
                });
                questionHTML += `</div>`;
            } else if (q.type === 'multiple') {
                questionHTML += `<div class="options" id="options-${index}">`;
                q.shuffledOptions.forEach((opt, optIndex) => {
                    questionHTML += `<label class="option-item" id="opt-${index}-${optIndex}"><input type="checkbox" name="q${index}" value="${optIndex}" onchange="handleMultipleAnswer(${index})"> ${opt}</label>`;
                });
                questionHTML += `</div>`;
            } else if (q.type === 'dropdown') {
                questionHTML += `<div class="options"><select id="select-${index}" onchange="handleDropdownAnswer(${index}, this.value)"><option value="-1">-- Выберите ответ --</option>`;
                q.shuffledOptions.forEach((opt, optIndex) => {
                    questionHTML += `<option value="${optIndex}">${opt}</option>`;
                });
                questionHTML += `</select></div>`;
            }

            block.innerHTML = questionHTML;
            container.appendChild(block);
        });
    }

    window.handleAnswer = function(qIndex, value) {
        userAnswers[qIndex] = parseInt(value);
        const options = document.querySelectorAll(`#options-${qIndex} .option-item`);
        options.forEach(opt => opt.classList.remove('selected-correct', 'selected-incorrect'));
        const selectedOpt = document.getElementById(`opt-${qIndex}-${value}`);
        if (selectedOpt) {
            const q = shuffledQuestions[qIndex];
            if (parseInt(value) === q.shuffledCorrect) {
                selectedOpt.classList.add('selected-correct');
            } else {
                selectedOpt.classList.add('selected-incorrect');
                const correctOpt = document.getElementById(`opt-${qIndex}-${q.shuffledCorrect}`);
                if (correctOpt) correctOpt.classList.add('selected-correct');
            }
        }
        checkAllAnswered();
    };

    window.handleMultipleAnswer = function(qIndex) {
        const checkboxes = document.querySelectorAll(`input[name="q${qIndex}"]:checked`);
        const selectedValues = Array.from(checkboxes).map(cb => parseInt(cb.value));
        userAnswers[qIndex] = selectedValues;
        const q = shuffledQuestions[qIndex];
        const options = document.querySelectorAll(`#options-${qIndex} .option-item`);
        options.forEach(opt => opt.classList.remove('selected-correct', 'selected-incorrect'));
        const correctSet = new Set(q.shuffledCorrect);
        const selectedSet = new Set(selectedValues);
        let isFullyCorrect = correctSet.size === selectedSet.size && [...correctSet].every(val => selectedSet.has(val));
        selectedValues.forEach(val => {
            const opt = document.getElementById(`opt-${qIndex}-${val}`);
            if (opt) {
                if (correctSet.has(val)) opt.classList.add('selected-correct');
                else opt.classList.add('selected-incorrect');
            }
        });
        if (!isFullyCorrect) {
            q.shuffledCorrect.forEach(val => {
                const opt = document.getElementById(`opt-${qIndex}-${val}`);
                if (opt) opt.classList.add('selected-correct');
            });
        }
        checkAllAnswered();
    };

    window.handleDropdownAnswer = function(qIndex, value) {
        userAnswers[qIndex] = parseInt(value);
        const select = document.getElementById(`select-${qIndex}`);
        const q = shuffledQuestions[qIndex];
        select.style.borderColor = '#ddd';
        select.style.backgroundColor = '#fff';
        if (parseInt(value) === q.shuffledCorrect) {
            select.style.borderColor = '#28a745';
            select.style.backgroundColor = '#d4edda';
        } else {
            select.style.borderColor = '#dc3545';
            select.style.backgroundColor = '#f8d7da';
        }
        checkAllAnswered();
    };

    function checkAllAnswered() {
        const allAnswered = userAnswers.every(ans => ans !== null && ans !== -1 && (!Array.isArray(ans) || ans.length > 0));
        document.getElementById('submit-btn').disabled = !allAnswered;
    }

    window.submitQuiz = function() {
        let correctCount = 0;
        shuffledQuestions.forEach((q, index) => {
            const userAns = userAnswers[index];
            let isCorrect = false;
            if (q.type === 'single' || q.type === 'boolean' || q.type === 'dropdown') {
                isCorrect = (userAns === q.shuffledCorrect);
            } else if (q.type === 'multiple') {
                const correctSet = new Set(q.shuffledCorrect);
                const userSet = new Set(userAns);
                isCorrect = correctSet.size === userSet.size && [...correctSet].every(val => userSet.has(val));
            }
            if (isCorrect) correctCount++;
            const block = document.getElementById(`q-block-${index}`);
            if (isCorrect) {
                block.classList.add('correct-highlight');
                block.classList.remove('incorrect-highlight');
            } else {
                block.classList.add('incorrect-highlight');
                block.classList.remove('correct-highlight');
            }
        });

        document.getElementById('results').style.display = 'block';
        document.getElementById('score-display').textContent = correctCount;
        document.getElementById('total-display').textContent = totalQuestions;
        const percentage = Math.round((correctCount / totalQuestions) * 100);
        document.getElementById('percentage-display').textContent = `Процент правильных ответов: ${percentage}%`;
        let grade = '';
        if (percentage >= 90) grade = 'Отлично!';
        else if (percentage >= 75) grade = 'Хорошо!';
        else if (percentage >= 60) grade = 'Удовлетворительно';
        else grade = 'Неудовлетворительно. Стоит повторить материал.';
        document.getElementById('grade-display').textContent = grade;
        document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        document.querySelectorAll('input, select').forEach(el => el.disabled = true);
        document.getElementById('submit-btn').disabled = true;
    };

    window.onload = initQuiz;
</script>

</body>
</html>
