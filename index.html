<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Имитационное моделирование</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin: 0 0 10px 0;
            font-size: 1.8em;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 0.95em;
        }
        /* Прогресс-бар */
        .progress-container {
            margin-bottom: 25px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.95em;
        }
        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            border-radius: 6px;
            transition: width 0.4s ease;
        }
        /* Блок вопроса */
        .question-block {
            background: #f9f9f9;
            border-left: 5px solid #3498db;
            padding: 25px;
            border-radius: 0 10px 10px 0;
            min-height: 300px;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .question-block.correct-highlight {
            border-left-color: #2ecc71;
            background: #eafaf1;
        }
        .question-block.incorrect-highlight {
            border-left-color: #e74c3c;
            background: #fdedec;
        }
        .question-type-badge {
            display: inline-block;
            background: #3498db;
            color: #fff;
            font-size: 0.75em;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .question-text {
            font-weight: 600;
            font-size: 1.15em;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .options label {
            display: block;
            margin-bottom: 12px;
            padding: 12px 16px;
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1em;
        }
        .options label:hover {
            border-color: #3498db;
            background: #f0f8ff;
        }
        .options input[type="radio"],
        .options input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }
        .options select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            margin-top: 5px;
            cursor: pointer;
        }
        .option-item {
            display: block;
            margin-bottom: 12px;
            padding: 12px 16px;
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1em;
        }
        .option-item:hover {
            border-color: #3498db;
            background: #f0f8ff;
        }
        .option-item.selected-correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
            font-weight: 600;
        }
        .option-item.selected-incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            font-weight: 600;
        }
        .explanation-box {
            display: none;
            margin-top: 15px;
            padding: 12px 16px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            font-size: 0.9em;
            color: #856404;
        }
        .explanation-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        /* Кнопки */
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #3498db;
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            background: #2980b9;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #d5dbdb;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* Результаты */
        .results {
            display: none;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #e8f6f3 0%, #d4efdf 100%);
            border-radius: 12px;
            border: 2px solid #1abc9c;
            animation: fadeIn 0.5s ease;
        }
        .results h2 {
            color: #16a085;
            margin-top: 0;
            font-size: 1.8em;
        }
        .score-circle {
            display: inline-block;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #fff;
            border: 6px solid #1abc9c;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin: 20px auto;
        }
        .score-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #16a085;
            line-height: 1;
        }
        .score-total {
            font-size: 0.9em;
            color: #7f8c8d;
        }
        .results p {
            font-size: 1.1em;
            margin: 10px 0;
        }
        .grade {
            font-size: 1.4em;
            font-weight: bold;
            margin-top: 15px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>Имитационное моделирование</h1>
    <p class="subtitle">Итоговый тест по методологическим основам</p>

    <!-- Прогресс -->
    <div class="progress-container" id="progress-container">
        <div class="progress-info">
            <span id="question-counter">Вопрос 1 из 73</span>
            <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
    </div>

    <!-- Контейнер вопроса -->
    <div id="quiz-container"></div>

    <!-- Кнопки навигации -->
    <div class="nav-buttons" id="nav-buttons">
        <button class="btn btn-secondary" id="btn-prev" onclick="prevQuestion()">← Назад</button>
        <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()">Далее →</button>
    </div>

    <!-- Результаты -->
    <div class="results" id="results">
        <h2>Тест завершён!</h2>
        <div class="score-circle">
            <div class="score-number" id="score-display">0</div>
            <div class="score-total">из <span id="total-display">73</span></div>
        </div>
        <p id="percentage-display"></p>
        <p class="grade" id="grade-display"></p>
        <button class="btn btn-primary" style="margin-top:20px; max-width:300px; margin-left:auto; margin-right:auto;" onclick="restartQuiz()">Пройти заново</button>
    </div>
</div>

    let shuffledQuestions = [];
    let userAnswers = [];
    let currentIndex = 0;
    let totalQuestions = questionsData.length;

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initQuiz() {
        shuffledQuestions = shuffleArray(questionsData);
        // Перемешиваем варианты внутри каждого вопроса
        shuffledQuestions = shuffledQuestions.map(q => {
            const newQ = { ...q };
            if (q.type === 'single' || q.type === 'boolean' || q.type === 'dropdown') {
                const indices = q.options.map((_, i) => i);
                const shuffled = shuffleArray(indices);
                newQ.shuffledOptions = shuffled.map(i => q.options[i]);
                newQ.shuffledCorrect = shuffled.indexOf(q.correct);
            } else if (q.type === 'multiple') {
                const indices = q.options.map((_, i) => i);
                const shuffled = shuffleArray(indices);
                newQ.shuffledOptions = shuffled.map(i => q.options[i]);
                newQ.shuffledCorrect = q.correct.map(c => shuffled.indexOf(c));
            }
            return newQ;
        });
        userAnswers = new Array(shuffledQuestions.length).fill(null);
        currentIndex = 0;
        renderQuestion();
        updateProgress();
    }

    function updateProgress() {
        const counter = document.getElementById('question-counter');
        const percent = document.getElementById('progress-percent');
        const fill = document.getElementById('progress-bar-fill');
        counter.textContent = `Вопрос ${currentIndex + 1} из ${totalQuestions}`;
        const p = Math.round(((currentIndex) / totalQuestions) * 100);
        percent.textContent = `${p}%`;
        fill.style.width = `${p}%`;
    }

    function renderQuestion() {
        const q = shuffledQuestions[currentIndex];
        const container = document.getElementById('quiz-container');
        const block = document.createElement('div');
        block.className = 'question-block';
        block.id = 'question-block';

        let typeLabel = '';
        if (q.type === 'single') typeLabel = 'Одиночный выбор';
        else if (q.type === 'multiple') typeLabel = 'Множественный выбор';
        else if (q.type === 'boolean') typeLabel = 'Верно / Неверно';
        else if (q.type === 'dropdown') typeLabel = 'Выберите из списка';

        let html = `<span class="question-type-badge">${typeLabel}</span>`;
        html += `<div class="question-text">${currentIndex + 1}. ${q.question}</div>`;

        const savedAnswer = userAnswers[currentIndex];

        if (q.type === 'single' || q.type === 'boolean') {
            html += `<div class="options" id="options-container">`;
            q.shuffledOptions.forEach((opt, optIndex) => {
                const checked = savedAnswer === optIndex ? 'checked' : '';
                let cls = 'option-item';
                if (savedAnswer !== null) {
                    if (optIndex === q.shuffledCorrect) cls += ' selected-correct';
                    else if (optIndex === savedAnswer) cls += ' selected-incorrect';
                }
                html += `<label class="${cls}"><input type="radio" name="q" value="${optIndex}" ${checked} onchange="handleAnswer(${optIndex})"> ${opt}</label>`;
            });
            html += `</div>`;
        } else if (q.type === 'multiple') {
            html += `<div class="options" id="options-container">`;
            const savedArr = Array.isArray(savedAnswer) ? savedAnswer : [];
            q.shuffledOptions.forEach((opt, optIndex) => {
                const checked = savedArr.includes(optIndex) ? 'checked' : '';
                let cls = 'option-item';
                if (savedAnswer !== null) {
                    const correctSet = new Set(q.shuffledCorrect);
                    if (correctSet.has(optIndex)) cls += ' selected-correct';
                    else if (savedArr.includes(optIndex)) cls += ' selected-incorrect';
                }
                html += `<label class="${cls}"><input type="checkbox" name="q" value="${optIndex}" ${checked} onchange="handleMultipleAnswer()"> ${opt}</label>`;
            });
            html += `</div>`;
        } else if (q.type === 'dropdown') {
            html += `<div class="options">`;
            html += `<select id="dropdown-select" onchange="handleDropdownAnswer(this.value)">`;
            html += `<option value="-1">-- Выберите ответ --</option>`;
            q.shuffledOptions.forEach((opt, optIndex) => {
                const selected = savedAnswer === optIndex ? 'selected' : '';
                html += `<option value="${optIndex}" ${selected}>${opt}</option>`;
            });
            html += `</select></div>`;
        }

        // Пояснение (появляется только после ответа)
        if (savedAnswer !== null && savedAnswer !== -1 && (!Array.isArray(savedAnswer) || savedAnswer.length > 0)) {
            html += `<div class="explanation-box show"><strong>Пояснение:</strong> ${q.explanation}</div>`;
        } else {
            html += `<div class="explanation-box" id="explanation-box"><strong>Пояснение:</strong> ${q.explanation}</div>`;
        }

        block.innerHTML = html;
        container.innerHTML = '';
        container.appendChild(block);

        // Обновляем состояние кнопок
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        btnPrev.disabled = currentIndex === 0;
        
        if (currentIndex === totalQuestions - 1) {
            btnNext.textContent = 'Завершить тест ✓';
            btnNext.classList.add('btn-primary');
        } else {
            btnNext.textContent = 'Далее →';
        }
    }

    function showExplanation() {
        const box = document.getElementById('explanation-box');
        if (box) box.classList.add('show');
    }

    function markOptions() {
        const q = shuffledQuestions[currentIndex];
        const saved = userAnswers[currentIndex];
        if (saved === null) return;
        const labels = document.querySelectorAll('#options-container .option-item');
        labels.forEach((label, idx) => {
            label.classList.remove('selected-correct', 'selected-incorrect');
        });
        if (q.type === 'single' || q.type === 'boolean' || q.type === 'dropdown') {
            labels.forEach((label, idx) => {
                if (idx === q.shuffledCorrect) label.classList.add('selected-correct');
                else if (idx === saved) label.classList.add('selected-incorrect');
            });
        } else if (q.type === 'multiple') {
            const correctSet = new Set(q.shuffledCorrect);
            const savedArr = Array.isArray(saved) ? saved : [];
            labels.forEach((label, idx) => {
                if (correctSet.has(idx)) label.classList.add('selected-correct');
                else if (savedArr.includes(idx)) label.classList.add('selected-incorrect');
            });
        }
    }

    window.handleAnswer = function(value) {
        userAnswers[currentIndex] = value;
        markOptions();
        showExplanation();
        updateProgress();
    };

    window.handleMultipleAnswer = function() {
        const checkboxes = document.querySelectorAll('input[name="q"]:checked');
        const values = Array.from(checkboxes).map(cb => parseInt(cb.value));
        userAnswers[currentIndex] = values;
        markOptions();
        showExplanation();
        updateProgress();
    };

    window.handleDropdownAnswer = function(value) {
        userAnswers[currentIndex] = parseInt(value);
        const select = document.getElementById('dropdown-select');
        const q = shuffledQuestions[currentIndex];
        select.style.borderColor = '#ddd';
        select.style.backgroundColor = '#fff';
        if (parseInt(value) === q.shuffledCorrect) {
            select.style.borderColor = '#28a745';
            select.style.backgroundColor = '#d4edda';
        } else {
            select.style.borderColor = '#dc3545';
            select.style.backgroundColor = '#f8d7da';
        }
        showExplanation();
        updateProgress();
    };

    window.nextQuestion = function() {
        if (currentIndex < totalQuestions - 1) {
            currentIndex++;
            renderQuestion();
            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            // Завершение
            finishQuiz();
        }
    };

    window.prevQuestion = function() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    };

    function finishQuiz() {
        let correctCount = 0;
        shuffledQuestions.forEach((q, index) => {
            const userAns = userAnswers[index];
            let isCorrect = false;
            if (q.type === 'single' || q.type === 'boolean' || q.type === 'dropdown') {
                isCorrect = (userAns === q.shuffledCorrect);
            } else if (q.type === 'multiple') {
                const correctSet = new Set(q.shuffledCorrect);
                const userSet = new Set(userAns || []);
                isCorrect = correctSet.size === userSet.size && [...correctSet].every(val => userSet.has(val));
            }
            if (isCorrect) correctCount++;
        });

        document.getElementById('progress-container').classList.add('hidden');
        document.getElementById('quiz-container').classList.add('hidden');
        document.getElementById('nav-buttons').classList.add('hidden');
        document.getElementById('results').style.display = 'block';

        document.getElementById('score-display').textContent = correctCount;
        document.getElementById('total-display').textContent = totalQuestions;
        const percentage = Math.round((correctCount / totalQuestions) * 100);
        document.getElementById('percentage-display').textContent = `Процент правильных ответов: ${percentage}%`;
        let grade = '';
        let color = '';
        if (percentage >= 90) { grade = 'Отлично! 🎉'; color = '#27ae60'; }
        else if (percentage >= 75) { grade = 'Хорошо! 👍'; color = '#2980b9'; }
        else if (percentage >= 60) { grade = 'Удовлетворительно'; color = '#f39c12'; }
        else { grade = 'Неудовлетворительно. Стоит повторить материал.'; color = '#c0392b'; }
        const gradeEl = document.getElementById('grade-display');
        gradeEl.textContent = grade;
        gradeEl.style.color = color;

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.restartQuiz = function() {
        document.getElementById('results').style.display = 'none';
        document.getElementById('progress-container').classList.remove('hidden');
        document.getElementById('quiz-container').classList.remove('hidden');
        document.getElementById('nav-buttons').classList.remove('hidden');
        initQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.onload = initQuiz;
</script>

</body>
</html>
